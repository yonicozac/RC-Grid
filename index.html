<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #b5532b;
  --accent-dark: #93421f;
  --accent-soft: #f6e9e1;
  --ink: #1d1c1a;
  --bg: #f7f5f0;
  --surface: #ffffff;
  --surface-2: #f1eee7;
  --border: #e6e1d7;
  --border-strong: #d4cdbf;
  --text: #1d1c1a;
  --text-muted: #7a756c;
  --pending-bg: #fbf6ea;
  --pending-border: #d9c38f;
  --pending-text: #7a5d1c;
  --success-bg: #eef3ec;
  --success-border: #cfdccb;
  --success-text: #3f5d3b;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(29,28,26,0.04);
  --shadow-md: 0 10px 30px -12px rgba(29,28,26,0.18);
  --serif: 'Instrument Serif', Georgia, serif;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

.hidden { display: none !important; }

/* ---- Logo ---- */
.logo {
  font-family: var(--serif);
  font-size: 1.6rem;
  font-weight: 400;
  color: var(--ink);
  letter-spacing: 0.2px;
  line-height: 1;
}

.logo span {
  font-style: italic;
  color: var(--accent);
  margin-left: 4px;
}

/* ---- Top bar ---- */
#topbar {
  background: rgba(247,245,240,0.85);
  backdrop-filter: saturate(160%) blur(12px);
  -webkit-backdrop-filter: saturate(160%) blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  display: flex;
  align-items: center;
  height: 64px;
  position: sticky;
  top: 0;
  z-index: 100;
}

nav {
  display: flex;
  align-items: center;
  gap: 28px;
  margin-left: 48px;
  flex: 1;
  align-self: stretch;
}

nav button {
  position: relative;
  height: 100%;
  background: none;
  border: none;
  border-radius: 0;
  color: var(--text-muted);
  font-size: 0.78rem;
  font-weight: 500;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  padding: 0 2px;
  display: inline-flex;
  align-items: center;
}

nav button::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 1.5px;
  background: var(--ink);
  transform: scaleX(0);
  transition: transform 0.25s ease;
}

nav button:hover { color: var(--ink); }
nav button.active { color: var(--ink); }
nav button.active::after { transform: scaleX(1); }

.nav-badge {
  display: inline-block;
  min-width: 18px;
  margin-left: 8px;
  padding: 0 6px;
  border-radius: 9px;
  background: var(--accent);
  color: #fff;
  font-size: 0.66rem;
  font-weight: 600;
  letter-spacing: 0;
  line-height: 18px;
  text-align: center;
}

#logoutBtn {
  margin-left: auto;
  background: none;
  border: 1px solid var(--border-strong);
  color: var(--text-muted);
  font-size: 0.8rem;
  padding: 7px 16px;
  border-radius: 999px;
}
#logoutBtn:hover { color: var(--ink); border-color: var(--ink); }

/* ---- Page wrapper ---- */
.page {
  max-width: 760px;
  margin: 0 auto;
  padding: 56px 24px 96px;
}

/* ---- Auth / Name setup ---- */
.auth-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(1200px 600px at 50% -10%, #efe7da 0%, transparent 60%),
    var(--bg);
}

.loading-text {
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.3rem;
  color: var(--text-muted);
}

.auth-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 48px 44px;
  width: 100%;
  max-width: 420px;
  box-shadow: var(--shadow-md);
}

.auth-card .logo {
  font-size: 2.2rem;
  margin-bottom: 36px;
}

.auth-card h3 {
  font-family: var(--serif);
  font-size: 1.7rem;
  font-weight: 400;
  color: var(--ink);
  margin-bottom: 6px;
}

.auth-card p {
  color: var(--text-muted);
  font-size: 0.9rem;
  margin-bottom: 24px;
}

/* ---- Inputs ---- */
input[type="text"],
input[type="email"],
input[type="url"],
input[type="number"],
input[type="date"],
textarea,
select {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  font-family: inherit;
  font-size: 0.9rem;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  margin: 5px 0;
}

input::placeholder, textarea::placeholder { color: #aaa499; }

input:focus, textarea:focus, select:focus {
  border-color: var(--ink);
  box-shadow: 0 0 0 3px rgba(29,28,26,0.06);
}

textarea { resize: vertical; }

/* ---- Buttons ---- */
button {
  font-family: inherit;
  font-size: 0.88rem;
  font-weight: 500;
  cursor: pointer;
  border-radius: 999px;
  transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s;
  border: none;
}

.btn-primary {
  background: var(--ink);
  color: #faf8f4;
  padding: 11px 22px;
}
.btn-primary:hover { background: #3a3834; }

.btn-secondary {
  background: transparent;
  color: var(--text);
  padding: 11px 22px;
  border: 1px solid var(--border-strong);
}
.btn-secondary:hover { border-color: var(--ink); }

.btn-ghost {
  background: transparent;
  color: var(--text-muted);
  padding: 8px 16px;
  border: 1px solid var(--border-strong);
}
.btn-ghost:hover { color: var(--ink); border-color: var(--ink); }

.btn-danger {
  background: transparent;
  color: #a03a2c;
  padding: 8px 16px;
  border: 1px solid #e3c4bd;
}
.btn-danger:hover { background: #fbefec; border-color: #a03a2c; }

.btn-sm {
  padding: 7px 16px;
  font-size: 0.8rem;
}

.auth-card button {
  width: 100%;
  background: var(--ink);
  color: #faf8f4;
  padding: 13px;
  font-size: 0.92rem;
  margin-top: 12px;
}
.auth-card button:hover { background: #3a3834; }

/* ---- Cards ---- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  transition: box-shadow 0.25s, border-color 0.25s;
}

.card:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }

.card.pending {
  background: var(--surface);
  border-color: var(--pending-border);
  padding: 18px 22px;
}

.card h3 {
  font-family: var(--serif);
  font-size: 1.55rem;
  font-weight: 400;
  line-height: 1.2;
  color: var(--ink);
  margin-bottom: 6px;
}

.meta {
  color: var(--text-muted);
  font-size: 0.82rem;
  letter-spacing: 0.2px;
  margin-bottom: 14px;
}

.meta a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s;
}
.meta a:hover { border-bottom-color: var(--accent); }

.card p { font-size: 0.9rem; color: #5d5951; margin-bottom: 12px; }

/* ---- Btn row ---- */
.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
}

/* ---- Section header ---- */
.section-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 28px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.section-header h2 {
  font-family: var(--serif);
  font-size: 2.6rem;
  font-weight: 400;
  line-height: 1;
  letter-spacing: -0.3px;
  color: var(--ink);
}

/* ---- Search ---- */
.search-wrap {
  position: relative;
  margin-bottom: 24px;
}

.search-wrap input {
  padding-left: 40px;
  border-radius: 999px;
  background: var(--surface);
}

.search-wrap::before {
  content: "⌕";
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-52%);
  color: var(--text-muted);
  font-size: 1.1rem;
  pointer-events: none;
}

/* ---- Admin panel ---- */
#adminPendingPanel {
  background: var(--pending-bg);
  border: 1px solid var(--pending-border);
  border-radius: var(--radius);
  padding: 24px 28px;
  margin-bottom: 40px;
}

#adminPendingPanel h3 {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  margin-bottom: 16px;
  color: var(--pending-text);
}

#adminPendingPanel .card:last-child { margin-bottom: 0; }

/* ---- Create track form ---- */
#createTrackForm {
  margin-bottom: 28px;
}

#createTrackForm h3 {
  margin-bottom: 16px;
}

/* ---- Race panel ---- */
.race-panel {
  border-top: 1px solid var(--border);
  margin-top: 20px;
  padding-top: 20px;
}

.race-panel h4 {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  margin: 24px 0 10px;
  color: var(--text-muted);
}

.race-panel h4:first-child { margin-top: 0; }

.race-panel > p {
  font-size: 0.82rem;
  color: var(--text-muted);
  margin: 12px 0 4px;
}

.race-panel > div:not(.cat-row) b { font-weight: 500; }

/* ---- Category rows ---- */
.cat-row {
  display: flex;
  gap: 8px;
  margin-bottom: 4px;
  align-items: center;
}

.cat-row input[type="text"] { flex: 1; }

.cat-row button {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 1.15rem;
  padding: 4px 8px;
  flex-shrink: 0;
}
.cat-row button:hover { color: #a03a2c; }

/* ---- Labels / checkboxes ---- */
label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.9rem;
  margin: 6px 0;
  cursor: pointer;
}

label input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--ink);
  margin: 0;
  flex-shrink: 0;
}

/* ---- Card header row ---- */
.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.card-header-text { flex: 1; min-width: 0; }

/* ---- Heart button ---- */
.heart-btn {
  background: none;
  border: 1px solid var(--border);
  width: 38px;
  height: 38px;
  font-size: 1.05rem;
  line-height: 1;
  color: #cfc8bb;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.heart-btn:hover { color: var(--accent); border-color: var(--accent); }
.heart-btn.active {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-soft);
}

/* ---- Race card distance ---- */
.distance-tag {
  display: inline-block;
  background: var(--surface-2);
  color: var(--text-muted);
  font-size: 0.75rem;
  font-weight: 500;
  padding: 2px 10px;
  border-radius: 99px;
  margin-left: 6px;
}

/* ---- Race card categories + drivers ---- */
.cat-line {
  padding: 12px 0;
  border-top: 1px solid var(--border);
}

.cat-head { align-items: center; margin-top: 0; }

.reg-tag {
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--success-text);
  background: var(--success-bg);
  border: 1px solid var(--success-border);
  border-radius: 999px;
  padding: 2px 10px;
  white-space: nowrap;
}

.reg-form {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-top: 10px;
}

.reg-form input[type="text"] {
  flex: 1;
  min-width: 160px;
  max-width: 260px;
  margin: 0;
}

.cat-name { flex: 1; font-size: 0.9rem; }

.count-pill {
  font-size: 0.75rem;
  color: var(--text-muted);
  background: var(--surface-2);
  border-radius: 999px;
  padding: 3px 10px;
  white-space: nowrap;
}

.card-footer { margin-top: 18px; }
.card-footer .delete-race-btn { margin-left: auto; }

.drivers-list {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 18px 28px;
}

.drivers-group h4 {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.drivers-group ol {
  padding-left: 20px;
  font-size: 0.88rem;
}

.drivers-group li { padding: 3px 0; }
.drivers-group li::marker { color: var(--text-muted); font-size: 0.8rem; }

.drivers-group .transponder {
  color: var(--text-muted);
  font-size: 0.78rem;
  margin-left: 6px;
  font-variant-numeric: tabular-nums;
}

.you-tag {
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--accent);
  margin-left: 4px;
}

/* ---- Status message ---- */
.status-msg {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-top: 12px;
}

.empty-state {
  text-align: center;
  padding: 72px 20px;
  color: var(--text-muted);
}

.empty-state p {
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.35rem;
}

/* ---- Responsive ---- */
@media (max-width: 600px) {
  .page { padding: 32px 16px 64px; }
  .auth-card { padding: 36px 24px; }
  #topbar { padding: 0 16px; }
  .logo { font-size: 1.4rem; }
  nav { margin-left: 20px; gap: 16px; }
  nav button { font-size: 0.72rem; letter-spacing: 1px; }
  #logoutBtn { padding: 6px 12px; font-size: 0.75rem; }
  .card { padding: 20px; }
  .section-header h2 { font-size: 2.1rem; }
  .section-header { flex-direction: column; align-items: flex-start; gap: 14px; }
}
</style>

</head>
<body>

<!-- Loading Area -->
<div id="loadingArea" class="auth-wrap">
  <div class="loading-text">Loading…</div>
</div>

<!-- Auth Area -->
<div id="authArea" class="auth-wrap hidden">
  <div class="auth-card">
    <div class="logo">RC<span>Grid</span></div>
    <h3>Sign in</h3>
    <p>Enter your email and we'll send you a magic link.</p>
    <input id="emailInput" type="email" placeholder="you@example.com">
    <button id="sendLinkBtn">Send Login Link</button>
    <p class="status-msg" id="loginStatus"></p>
  </div>
</div>

<!-- Name Setup Area -->
<div id="nameSetupArea" class="auth-wrap hidden">
  <div class="auth-card">
    <div class="logo">RC<span>Grid</span></div>
    <h3>Welcome!</h3>
    <p>What should we call you?</p>
    <input id="nameInput" type="text" placeholder="Your name">
    <button id="saveNameBtn">Continue</button>
    <p class="status-msg" id="nameSetupStatus"></p>
  </div>
</div>

<!-- App Area -->
<div id="appArea" class="hidden">

  <div id="topbar">
    <div class="logo">RC<span>Grid</span></div>
    <nav>
      <button id="navRaces">Races</button>
      <button id="navTracks">Tracks<span id="pendingBadge" class="nav-badge hidden"></span></button>
    </nav>
    <button id="logoutBtn">Logout</button>
  </div>

  <div class="page">

    <!-- Tracks View -->
    <div id="tracksView" class="hidden">

      <div id="adminPendingPanel" class="hidden">
        <h3>Pending Track Approvals</h3>
        <div id="pendingContainer"></div>
      </div>

      <div class="section-header">
        <h2>Tracks</h2>
        <button id="showCreateTrackBtn" class="btn-primary">+ New Track</button>
      </div>

      <div id="createTrackForm" class="card hidden">
        <h3>Submit New Track</h3>
        <input id="newTrackName" type="text" placeholder="Track name">
        <input id="newTrackLocation" type="text" placeholder="Location">
        <input id="newTrackWebsite" type="url" placeholder="Website (optional)">
        <textarea id="newTrackDescription" placeholder="Description (optional)" rows="3"></textarea>
        <div class="btn-row">
          <button id="submitCreateTrackBtn" class="btn-primary">Submit for Approval</button>
          <button id="cancelCreateTrackBtn" class="btn-secondary">Cancel</button>
        </div>
      </div>

      <div class="search-wrap">
        <input id="trackSearch" type="text" placeholder="Search tracks by name, location…">
      </div>

      <div id="tracksContainer"></div>

    </div>

    <!-- Races View -->
    <div id="racesView" class="hidden">
      <div class="section-header">
        <h2>Upcoming Races</h2>
      </div>
      <div id="racesContainer"></div>
    </div>

  </div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
