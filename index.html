<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #f0590a;
  --accent-dark: #c94a08;
  --accent-soft: #fff1e8;
  --ink: #0f172a;
  --ink-2: #1e293b;
  --bg: #e9edf2;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --border: #dde3ea;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-2: #475569;
  --text-muted: #64748b;
  --grid-line: rgba(15, 23, 42, 0.05);
  --grid-line-major: rgba(15, 23, 42, 0.08);
  --pending-bg: #fffbeb;
  --pending-border: #f59e0b;
  --pending-text: #92400e;
  --success-bg: #ecfdf5;
  --success-border: #a7f3d0;
  --success-text: #047857;
  --danger: #dc2626;
  --radius: 8px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 2px 8px -2px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 1px 2px rgba(15, 23, 42, 0.06), 0 10px 28px -12px rgba(15, 23, 42, 0.22);
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Grid backdrop: fine 24px grid with a 120px major grid, fading out toward the bottom */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    linear-gradient(var(--grid-line-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line-major) 1px, transparent 1px),
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  background-position: -1px -1px;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.25) 100%);
  mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.25) 100%);
}

.hidden { display: none !important; }

/* ---- Logo ---- */
.logo {
  font-family: var(--mono);
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 2px;
}

.logo::before {
  content: "";
  width: 10px;
  height: 10px;
  background: var(--accent);
  border-radius: 2px;
  margin-right: 8px;
}

.logo span { color: var(--accent); }
.logo span::before { content: "_"; color: var(--text-muted); }

/* ---- Top bar ---- */
#topbar {
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: saturate(180%) blur(10px);
  -webkit-backdrop-filter: saturate(180%) blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  display: flex;
  align-items: center;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 100;
}

nav {
  display: flex;
  align-items: stretch;
  gap: 4px;
  margin-left: 36px;
  flex: 1;
  align-self: stretch;
}

nav button {
  position: relative;
  background: none;
  border: none;
  border-radius: 0;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 0 12px;
  display: inline-flex;
  align-items: center;
}

nav button::after {
  content: "";
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: -1px;
  height: 2px;
  background: var(--accent);
  opacity: 0;
  transition: opacity 0.15s;
}

nav button:hover { color: var(--ink); }
nav button.active { color: var(--ink); }
nav button.active::after { opacity: 1; }

.nav-badge {
  display: inline-block;
  min-width: 18px;
  margin-left: 8px;
  padding: 0 5px;
  border-radius: 4px;
  background: var(--accent);
  color: #fff;
  font-family: var(--mono);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0;
  line-height: 18px;
  text-align: center;
}

#logoutBtn {
  margin-left: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-2);
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
}
#logoutBtn:hover { color: var(--ink); border-color: var(--border-strong); }

/* ---- Page wrapper ---- */
.page {
  max-width: 820px;
  margin: 0 auto;
  padding: 48px 24px 96px;
}

/* ---- Auth / Name setup ---- */
.auth-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.loading-text {
  font-family: var(--mono);
  font-size: 0.8rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
}

.auth-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px;
  width: 100%;
  max-width: 400px;
  box-shadow: var(--shadow-md);
}

.auth-card .logo { margin-bottom: 32px; }

.auth-card h3 {
  font-size: 1.35rem;
  font-weight: 600;
  letter-spacing: -0.3px;
  color: var(--ink);
  margin-bottom: 4px;
}

.auth-card p {
  color: var(--text-muted);
  font-size: 0.88rem;
  margin-bottom: 20px;
}

/* ---- Inputs ---- */
input[type="text"],
input[type="email"],
input[type="url"],
input[type="number"],
input[type="date"],
textarea,
select {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  font-family: inherit;
  font-size: 0.88rem;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  margin: 4px 0;
}

input::placeholder, textarea::placeholder { color: #94a3b8; }

input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(240, 89, 10, 0.12);
}

textarea { resize: vertical; }

/* ---- Buttons ---- */
button {
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: background 0.15s, color 0.15s, border-color 0.15s;
  border: none;
}

button:disabled { opacity: 0.55; cursor: default; }

.btn-primary {
  background: var(--ink);
  color: #fff;
  padding: 9px 16px;
  border: 1px solid var(--ink);
}
.btn-primary:hover { background: var(--ink-2); }

.btn-secondary {
  background: var(--surface);
  color: var(--text);
  padding: 9px 16px;
  border: 1px solid var(--border-strong);
}
.btn-secondary:hover { background: var(--surface-2); }

.btn-ghost {
  background: var(--surface);
  color: var(--text-2);
  padding: 7px 12px;
  border: 1px solid var(--border);
}
.btn-ghost:hover { color: var(--ink); border-color: var(--border-strong); background: var(--surface-2); }

.btn-danger {
  background: var(--surface);
  color: var(--danger);
  padding: 7px 12px;
  border: 1px solid #fecaca;
}
.btn-danger:hover { background: #fef2f2; border-color: var(--danger); }

.btn-sm {
  padding: 6px 12px;
  font-size: 0.78rem;
}

.auth-card button {
  width: 100%;
  background: var(--ink);
  color: #fff;
  padding: 11px;
  font-size: 0.88rem;
  margin-top: 10px;
}
.auth-card button:hover { background: var(--ink-2); }

/* ---- Cards ---- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  transition: border-color 0.15s, box-shadow 0.15s;
}

.card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }

.card.pending {
  border: 1px dashed var(--pending-border);
  padding: 14px 18px;
}
.card.pending:hover { box-shadow: none; }

.card h3 {
  font-size: 1.08rem;
  font-weight: 600;
  letter-spacing: -0.2px;
  line-height: 1.3;
  color: var(--ink);
  margin-bottom: 4px;
}

.meta {
  font-family: var(--mono);
  color: var(--text-muted);
  font-size: 0.74rem;
  margin-bottom: 12px;
  font-variant-numeric: tabular-nums;
}

.meta a {
  color: var(--accent);
  text-decoration: none;
}
.meta a:hover { text-decoration: underline; }

.card p { font-size: 0.88rem; color: var(--text-2); margin-bottom: 12px; }

/* ---- Btn row ---- */
.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

/* ---- Section header ---- */
.section-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 24px;
}

.section-header h2 {
  font-size: 1.75rem;
  font-weight: 600;
  letter-spacing: -0.6px;
  line-height: 1.1;
  color: var(--ink);
}

.section-header h2::before {
  content: "//";
  font-family: var(--mono);
  font-size: 1.1rem;
  font-weight: 500;
  color: var(--accent);
  margin-right: 10px;
  vertical-align: 3px;
}

/* ---- Search ---- */
.search-wrap {
  position: relative;
  margin-bottom: 20px;
}

.search-wrap input { padding-left: 36px; box-shadow: var(--shadow); }

.search-wrap::before {
  content: "⌕";
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-52%);
  color: var(--text-muted);
  font-size: 1.05rem;
  pointer-events: none;
}

/* ---- Admin panel ---- */
#adminPendingPanel {
  background: var(--pending-bg);
  border: 1px solid #fde68a;
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 36px;
}

#adminPendingPanel h3 {
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 12px;
  color: var(--pending-text);
}

#adminPendingPanel .card:last-child { margin-bottom: 0; }

/* ---- Create track form ---- */
#createTrackForm { margin-bottom: 24px; }
#createTrackForm h3 { margin-bottom: 14px; }

/* ---- Race panel ---- */
.race-panel {
  border-top: 1px solid var(--border);
  margin-top: 18px;
  padding-top: 18px;
}

.race-panel h4 {
  font-family: var(--mono);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin: 22px 0 8px;
  color: var(--text-muted);
}

.race-panel h4:first-child { margin-top: 0; }

.race-panel > p {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin: 10px 0 2px;
}

.race-panel > div:not(.cat-row) b { font-weight: 600; }

/* ---- Category rows (race creation) ---- */
.cat-row {
  display: flex;
  gap: 8px;
  margin-bottom: 4px;
  align-items: center;
}

.cat-row input[type="text"] { flex: 1; }

.cat-row button {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 1.1rem;
  padding: 4px 8px;
  flex-shrink: 0;
}
.cat-row button:hover { color: var(--danger); }

/* ---- Labels / checkboxes ---- */
label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.88rem;
  margin: 6px 0;
  cursor: pointer;
}

label input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
  margin: 0;
  flex-shrink: 0;
}

/* ---- Card header row ---- */
.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.card-header-text { flex: 1; min-width: 0; }

/* ---- Heart button ---- */
.heart-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  width: 34px;
  height: 34px;
  font-size: 0.95rem;
  line-height: 1;
  color: #cbd5e1;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.heart-btn:hover { color: var(--accent); border-color: var(--accent); }
.heart-btn.active {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-soft);
}

/* ---- Distance tag ---- */
.distance-tag {
  display: inline-block;
  background: var(--surface-2);
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 0.7rem;
  padding: 1px 6px;
  border-radius: 4px;
  margin-left: 6px;
}

/* ---- Race card categories + drivers ---- */
.cat-line {
  padding: 10px 0;
  border-top: 1px solid var(--border);
}

.cat-head { align-items: center; margin-top: 0; }

.cat-name { flex: 1; font-size: 0.88rem; font-weight: 500; }

.cat-meta {
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 400;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.reg-tag {
  font-family: var(--mono);
  font-size: 0.7rem;
  border-radius: 4px;
  padding: 2px 7px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.reg-tag {
  color: var(--success-text);
  background: var(--success-bg);
  border: 1px solid var(--success-border);
}

.reg-form {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-top: 10px;
}

.reg-form input[type="text"] {
  flex: 1;
  min-width: 160px;
  max-width: 240px;
  margin: 0;
  font-family: var(--mono);
  font-size: 0.82rem;
}

.card-footer {
  margin-top: 6px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}
.card-footer .delete-race-btn,
.delete-track-btn { margin-left: auto; }

.drivers-list {
  margin-top: 14px;
  padding: 14px 16px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px 24px;
}

.drivers-list-actions {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.drivers-list-actions span {
  font-family: var(--mono);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-2);
}

.drivers-group h4 {
  font-family: var(--mono);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.drivers-group ol {
  padding-left: 22px;
  font-size: 0.85rem;
}

.drivers-group li { padding: 2px 0; }
.drivers-group li::marker {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--text-muted);
}

.drivers-group .transponder {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--text-muted);
  margin-left: 6px;
}

.remove-driver-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 0.95rem;
  line-height: 1;
  padding: 0 4px;
  margin-left: 4px;
  border-radius: 4px;
  opacity: 0.6;
}
.remove-driver-btn:hover { color: var(--danger); background: #fef2f2; opacity: 1; }

.you-tag {
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid currentColor;
  border-radius: 3px;
  padding: 0 4px;
  margin-left: 4px;
  vertical-align: 1px;
}

/* ---- Past races (collapsed, low-key) ---- */
.past-toggle {
  display: block;
  margin: 28px 0 12px;
  padding: 4px 0;
  background: none;
  border: none;
  border-radius: 0;
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.past-toggle:hover { color: var(--text-2); }

.card.past { opacity: 0.7; }
.card.past:hover { opacity: 1; }

/* ---- Status message ---- */
.status-msg {
  font-size: 0.82rem;
  color: var(--text-muted);
  margin-top: 10px;
}

.status-msg b { color: var(--text); font-weight: 600; }

.status-msg .sender {
  font-family: var(--mono);
  font-size: 0.74rem;
  color: var(--text-2);
  word-break: break-all;
}

.empty-state {
  text-align: center;
  padding: 48px 20px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.85);
  color: var(--text-muted);
}

.empty-state p {
  font-family: var(--mono);
  font-size: 0.8rem;
}

/* ---- Responsive ---- */
@media (max-width: 600px) {
  .page { padding: 28px 16px 64px; }
  .auth-card { padding: 28px 22px; }
  #topbar { padding: 0 16px; }
  nav { margin-left: 16px; gap: 0; }
  nav button { padding: 0 8px; font-size: 0.7rem; }
  nav button::after { left: 8px; right: 8px; }
  .logo { font-size: 0.9rem; }
  .card { padding: 16px; }
  .section-header h2 { font-size: 1.45rem; }
  .section-header { flex-direction: column; align-items: flex-start; gap: 12px; }
  .cat-head .btn-primary, .cat-head .btn-ghost { margin-left: auto; }
  .reg-form input[type="text"] { flex: 1 0 100%; max-width: none; }
}
</style>

</head>
<body>

<!-- Loading Area -->
<div id="loadingArea" class="auth-wrap">
  <div class="loading-text">Loading…</div>
</div>

<!-- Auth Area -->
<div id="authArea" class="auth-wrap hidden">
  <div class="auth-card">
    <div class="logo">RC<span>Grid</span></div>
    <h3>Sign in</h3>
    <p>Enter your email and we'll send you a magic link.</p>
    <input id="emailInput" type="email" placeholder="you@example.com">
    <button id="sendLinkBtn">Send Login Link</button>
    <p class="status-msg" id="loginStatus"></p>
  </div>
</div>

<!-- Name Setup Area -->
<div id="nameSetupArea" class="auth-wrap hidden">
  <div class="auth-card">
    <div class="logo">RC<span>Grid</span></div>
    <h3>Welcome!</h3>
    <p>What should we call you?</p>
    <input id="nameInput" type="text" placeholder="Your name">
    <button id="saveNameBtn">Continue</button>
    <p class="status-msg" id="nameSetupStatus"></p>
  </div>
</div>

<!-- App Area -->
<div id="appArea" class="hidden">

  <div id="topbar">
    <div class="logo">RC<span>Grid</span></div>
    <nav>
      <button id="navRaces">Races</button>
      <button id="navTracks">Tracks<span id="pendingBadge" class="nav-badge hidden"></span></button>
    </nav>
    <button id="logoutBtn">Logout</button>
  </div>

  <div class="page">

    <!-- Tracks View -->
    <div id="tracksView" class="hidden">

      <div id="adminPendingPanel" class="hidden">
        <h3>Pending Track Approvals</h3>
        <div id="pendingContainer"></div>
      </div>

      <div class="section-header">
        <h2>Tracks</h2>
        <button id="showCreateTrackBtn" class="btn-primary">+ New Track</button>
      </div>

      <div id="createTrackForm" class="card hidden">
        <h3>Submit New Track</h3>
        <input id="newTrackName" type="text" placeholder="Track name">
        <input id="newTrackLocation" type="text" placeholder="Location">
        <input id="newTrackWebsite" type="url" placeholder="Website (optional)">
        <textarea id="newTrackDescription" placeholder="Description (optional)" rows="3"></textarea>
        <div class="btn-row">
          <button id="submitCreateTrackBtn" class="btn-primary">Submit for Approval</button>
          <button id="cancelCreateTrackBtn" class="btn-secondary">Cancel</button>
        </div>
      </div>

      <div class="search-wrap">
        <input id="trackSearch" type="text" placeholder="Search tracks by name, location…">
      </div>

      <div id="tracksContainer"></div>

    </div>

    <!-- Races View -->
    <div id="racesView" class="hidden">
      <div class="section-header">
        <h2>Upcoming Races</h2>
      </div>
      <div id="racesContainer"></div>
    </div>

  </div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
